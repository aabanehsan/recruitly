[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recruitly"
version = "0.1.0"
description = "Applicant tracking for student org recruitment: import Google Form responses, clean them up, and manage applicant profiles."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Aaban Ehsan" }]
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "sqlalchemy>=2.0",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "httpx>=0.25",
  "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
recruitly = "recruitly.cli:main"

[project.urls]
Homepage = "https://github.com/aabanehsan/recruitly"

[tool.setuptools.packages.find]
include = ["recruitly*"]

[tool.setuptools.package-data]
recruitly = ["templates/*.html", "static/*", "sample_data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
